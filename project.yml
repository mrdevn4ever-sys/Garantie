name: Kaufarchiv
options:
  bundleIdPrefix: ch.kaufarchiv
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: de
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
packages:
  KaufarchivCore:
    path: Packages/KaufarchivCore
targets:
  Kaufarchiv:
    type: application
    platform: iOS
    sources:
      - path: Kaufarchiv
      - path: Shared
    dependencies:
      - package: KaufarchivCore
      - target: KaufarchivShare
        embed: true
    entitlements:
      path: Kaufarchiv/Kaufarchiv.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.ch.kaufarchiv.app]
        com.apple.developer.icloud-services: [CloudKit]
        com.apple.security.application-groups: [group.ch.kaufarchiv.app]
        aps-environment: development
        com.apple.developer.usernotifications.time-sensitive: true
    info:
      path: Kaufarchiv/Info.plist
      properties:
        CFBundleDisplayName: Kaufarchiv
        CFBundleDevelopmentRegion: de
        CFBundleLocalizations: [de]
        LSApplicationCategoryType: public.app-category.productivity
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes: [fetch, remote-notification]
        BGTaskSchedulerPermittedIdentifiers: [ch.kaufarchiv.app.refresh]
        NSCameraUsageDescription: Die Kamera wird verwendet, um Belege und Fotos von Produkten zu erfassen.
        NSPhotoLibraryUsageDescription: Fotos von Belegen und Produkten können aus deiner Mediathek übernommen werden.
        NSCalendarsWriteOnlyAccessUsageDescription: Fristen können als Termine in deinen Kalender übertragen werden.
        NSFaceIDUsageDescription: Face ID schützt den Zugang zu deinen Belegen.
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        CFBundleURLTypes:
          - CFBundleURLName: ch.kaufarchiv.app
            CFBundleURLSchemes: [kaufarchiv]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Kaufarchiv-Sicherung
            LSHandlerRank: Owner
            LSItemContentTypes: [ch.kaufarchiv.backup]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: ch.kaufarchiv.backup
            UTTypeDescription: Kaufarchiv-Sicherung
            UTTypeConformsTo: [com.apple.package, public.composite-content]
            UTTypeTagSpecification:
              public.filename-extension: [kaufarchiv]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.kaufarchiv.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets: [KaufarchivTests]
      storeKitConfiguration: Kaufarchiv/Resources/Kaufarchiv.storekit

  KaufarchivShare:
    type: app-extension
    platform: iOS
    sources:
      - path: KaufarchivShare
      - path: Shared
    entitlements:
      path: KaufarchivShare/KaufarchivShare.entitlements
      properties:
        com.apple.security.application-groups: [group.ch.kaufarchiv.app]
    info:
      path: KaufarchivShare/Info.plist
      properties:
        CFBundleDisplayName: Im Kaufarchiv sichern
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsImageWithMaxCount: 10
              NSExtensionActivationSupportsFileWithMaxCount: 10
              NSExtensionActivationSupportsWebURLWithMaxCount: 0
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.kaufarchiv.app.share

  KaufarchivTests:
    type: bundle.unit-test
    platform: iOS
    sources: [KaufarchivTests]
    dependencies:
      - target: Kaufarchiv
      - package: KaufarchivCore
